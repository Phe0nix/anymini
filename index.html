<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyMini | Minify Everything</title>
    <meta name="author" content="Pranab Dey" />
    <meta name="description" content="AnyMini minify everything" />
    <link rel="stylesheet" href="index.css" type="text/css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css" type="text/css" />
<body>
    <h2 class="heading">AnyMini</h2>
    <main class="app-shell">
        <header class="hero">
            <p class="eyebrow">Tiny tool. Big cleanup.</p>
            <h1 class="heading">AnyMini</h1>
            <p class="intro">Minify text or code instantly with smart rules, live stats, and one-click export.</p>
        </header>

        <section class="workspace" aria-label="AnyMini workspace">
            <div class="panel">
                <div class="panel-head">
                    <h2>Input</h2>
                    <label class="field-inline" for="modeSelect">
                        Mode
                        <select id="modeSelect" class="mode-select">
                            <option value="smart" selected>Smart</option>
                            <option value="code">Code</option>
                            <option value="text">Text</option>
                        </select>
                    </label>
                </div>

                <textarea id="sourceText" class="editor" placeholder="Paste your code or text here..."></textarea>

                <div class="controls">
                    <button id="minifyBtn" class="btn btn-primary" type="button">Minify</button>
                    <button id="clearBtn" class="btn" type="button">Reset</button>
                    <button id="rawBtn" class="btn" type="button">Raw Output</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-head">
                    <h2>Output</h2>
                    <p id="statusText" class="status">Ready</p>
                </div>

                <textarea id="resultText" class="editor" placeholder="Minified output appears here" readonly></textarea>

                <div class="controls">
                    <button id="copyBtn" class="btn btn-primary" type="button">Copy</button>
                    <button id="downloadBtn" class="btn" type="button">Download</button>
                </div>
            </div>
        </section>

        <section class="metrics" aria-label="Output metrics">
            <article class="metric-card">
                <p class="metric-label">Input chars</p>
                <p id="inputCount" class="metric-value">0</p>
            </article>
            <article class="metric-card">
                <p class="metric-label">Output chars</p>
                <p id="outputCount" class="metric-value">0</p>
            </article>
            <article class="metric-card">
                <p class="metric-label">Saved</p>
                <p id="savedCount" class="metric-value">0%</p>
            </article>
        </section>
    </main>

    <footer class="footer">
        <p>
            <a href="https://github.com/Phe0nix/anymini" target="_blank" rel="noreferrer">AnyMini</a>
            <span>by</span>
            <a href="https://github.com/Phe0nix" target="_blank" rel="noreferrer">Pranab</a>
            <span>|</span>
            <a href="https://twitter.com/pra_NAB" target="_blank" rel="noreferrer">@pra_NAB</a>
        </p>
    </footer>
    <script src="index.js" type="text/javascript" defer></script>
</body>
</html>
